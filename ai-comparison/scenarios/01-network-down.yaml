# ═══════════════════════════════════════════════════════════════════════════════
# หมวด 1: เครือข่ายล่ม (switch / AP / gateway down) — ข้อมูลรูปแบบ Omada
# 5 เคส: NET-01 … NET-05
#
# ทุกเคสในโฟลเดอร์นี้เขียน ground_truth "ก่อน" ส่งให้ AI ตัวใดตัวหนึ่ง (ยังไม่เคยรัน AI)
# ดูคำอธิบายฟิลด์ทั้งหมดที่ ../README.md และเกณฑ์ให้คะแนนที่ ../RUBRIC.md
# ═══════════════════════════════════════════════════════════════════════════════

- id: NET-01
  title: "AP ล็อบบี้ดับเครื่องเดียว อุปกรณ์รอบข้างปกติ"
  category: network_down
  prompt_kind: analyze_device
  input:
    type: ap
    name: "AP-Lobby-01"
    ip: "192.168.10.21"
    status: "down/มีปัญหา"
    apContext: "AP อื่นที่มีปัญหา 0 ตัว: ไม่พบ"
    cameraContext: "subnet เดียวกัน 3 ตัว ออฟไลน์ 0 ตัว — ไม่พบ"
  ground_truth:
    root_cause: "ตัว AP-Lobby-01 เองขัดข้องเครื่องเดียว (ไฟ PoE ไม่เข้า / สายแลนหรือพอร์ตเสีย / ฮาร์ดแวร์ AP) ไม่ใช่ปัญหาของเครือข่ายส่วนรวม เพราะ AP อื่นและกล้อง 3 ตัวใน subnet เดียวกันปกติทั้งหมด"
    partial_root_cause: "ระบุว่าเป็นปัญหาเฉพาะเครื่อง/เฉพาะจุด แต่ไม่ระบุสาเหตุย่อย (ไฟ/สาย/ฮาร์ดแวร์) หรือระบุกว้างๆ ว่า 'ปัญหาเครือข่าย' โดยยังชี้ไปที่ AP ตัวนี้"
    wrong_root_cause_examples:
      - "สรุปว่า switch/gateway/เครือข่ายทั้งชั้นล่ม"
      - "สรุปว่าอินเทอร์เน็ตหรือ DHCP ล่ม"
    key_evidence:
      - "AP อื่นที่มีปัญหา = 0 ตัว"
      - "กล้องใน subnet เดียวกัน 3 ตัว ออฟไลน์ 0 ตัว"
    severity: medium
    severity_rationale: "กระทบเฉพาะพื้นที่ครอบคลุมของ AP 1 ตัว (จุดอับสัญญาณ) ยังมี AP อื่นครอบคลุมบางส่วนและไม่มีบริการหลักล่ม จึงไม่ถึง high แต่ไม่ควรมองข้าม (low) เพราะผู้ใช้ในพื้นที่ล็อบบี้ใช้ WiFi ไม่ได้"
    correct_actions:
      - "ตรวจไฟสถานะ (LED) ของ AP และตรวจว่าพอร์ต PoE ของ switch จ่ายไฟอยู่"
      - "ทดสอบสายแลน/ลองย้ายไปพอร์ตอื่น"
      - "รีบูตหรือรีเซ็ต AP แล้วดูว่ากลับมาเชื่อมต่อ controller ไหม"
      - "ถ้ายังไม่กลับ เปลี่ยนเครื่องหรือส่งซ่อม"
    unacceptable_actions:
      - "รีสตาร์ท switch/gateway ทั้งระบบ"
      - "แนะนำเปลี่ยนอุปกรณ์เครือข่ายหลายตัวพร้อมกัน"
  design_note: "เคสพื้นฐาน (baseline) ที่เห็นชัดว่าเป็นปัญหาจุดเดียว ใช้เทียบกับเคสลูกโซ่ — ดูว่า AI ไม่ over-generalize"

- id: NET-02
  title: "Gateway ขอบเครือข่ายล่ม LAN ภายในยังปกติ"
  category: network_down
  prompt_kind: context_text
  input:
    topic: wifi
    context: "อุปกรณ์เครือข่าย: AP 6, Switch 2, Gateway 1 — ปกติ 8 มีปัญหา 1: GW-EDGE-01(gateway)"
  ground_truth:
    root_cause: "Gateway GW-EDGE-01 (เราเตอร์/ไฟร์วอลล์ขอบเครือข่าย) ล่มหรือขาดการเชื่อมต่อ ขณะที่ AP 6 ตัวและ switch 2 ตัวยังปกติ จึงเป็นปัญหาที่ทางออกสู่ภายนอก (WAN/อินเทอร์เน็ต) ไม่ใช่ LAN ภายใน"
    partial_root_cause: "ระบุว่า GW-EDGE-01 มีปัญหา แต่ไม่ได้แยกว่า LAN ภายในยังปกติ หรือระบุว่าเป็นเรื่อง uplink/อินเทอร์เน็ตโดยไม่ชี้อุปกรณ์"
    wrong_root_cause_examples:
      - "สรุปว่า AP หรือ switch เสียหลายตัว"
      - "ไม่พูดถึง gateway เลย"
    key_evidence:
      - "มีปัญหา 1 ตัว และเป็น gateway ตัวเดียว"
      - "AP และ Switch ทั้งหมดปกติ (ปกติ 8 จาก 9)"
    severity: critical
    severity_rationale: "Gateway ล่ม = ทั้งองค์กรออกอินเทอร์เน็ต/ใช้บริการคลาวด์/เชื่อมสาขาไม่ได้ เป็นการสูญเสียบริการหลักระดับทั้งองค์กร"
    correct_actions:
      - "ตรวจสถานะไฟ/พอร์ต WAN และ LED ของ GW-EDGE-01"
      - "ตรวจ modem/ลิงก์ ISP และลองรีบูต gateway ตามขั้นตอน"
      - "ติดต่อ ISP ถ้าลิงก์ภายนอกขาด และใช้ลิงก์สำรอง (เช่น 4G) ถ้ามี"
    unacceptable_actions:
      - "เปลี่ยน AP หรือ switch"
      - "ไม่แนะนำให้ตรวจ gateway/WAN"
  design_note: "ทดสอบการอ่านตัวเลข 'มีปัญหา 1' แล้วระบุชนิดอุปกรณ์ที่สำคัญที่สุดถูก (ชนิดเดียวกับรูปแบบข้อความ wifiCtxText จริงในบอท)"

- id: NET-03
  title: "Switch ชั้น 3 ล่ม พา AP 3 ตัวหลุดตาม"
  category: network_down
  prompt_kind: context_text
  input:
    topic: wifi
    context: "อุปกรณ์เครือข่าย: AP 8, Switch 3, Gateway 1 — ปกติ 8 มีปัญหา 4: SW-FL3-01(switch), AP-FL3-01(ap), AP-FL3-02(ap), AP-FL3-03(ap)"
  ground_truth:
    root_cause: "SW-FL3-01 (switch ชั้น 3) ขัดข้อง (ไฟ/ฮาร์ดแวร์/uplink) ทำให้ AP 3 ตัวที่ต่ออยู่กับมัน (AP-FL3-01..03) หลุดตามเป็นผลพวง ไม่ใช่ AP เสียพร้อมกัน 3 ตัว"
    partial_root_cause: "ระบุว่ามีจุดร่วม/อุปกรณ์โครงสร้างของชั้น 3 เป็นสาเหตุ แต่ไม่ชี้ switch เฉพาะตัว หรือชี้ switch แต่ยังเสนอให้ไล่ตรวจ AP ทีละตัวเป็นหลัก"
    wrong_root_cause_examples:
      - "สรุปว่า AP 3 ตัวเสียแยกกัน"
      - "สรุปว่า gateway/อินเทอร์เน็ตล่ม"
    key_evidence:
      - "อุปกรณ์ที่มีปัญหามี switch 1 ตัวอยู่ในกลุ่มเดียวกับ AP ที่ชื่อชั้นเดียวกัน (FL3)"
      - "อุปกรณ์อื่นๆ 8 ตัวปกติ"
    severity: high
    severity_rationale: "กระทบทั้งชั้น 3 (WiFi ทั้ง 3 จุดและอุปกรณ์อื่นที่ต่อ switch ตัวนี้) แต่ไม่ใช่ทั้งองค์กร"
    correct_actions:
      - "ตรวจ SW-FL3-01 ก่อน (ไฟเลี้ยง พัดลม uplink สถานะพอร์ต)"
      - "ตรวจสาย uplink ไปยัง switch แกนกลาง"
      - "เมื่อ switch กลับมา ตรวจว่า AP ทั้ง 3 กลับมาเชื่อมต่อเอง"
    unacceptable_actions:
      - "ไล่แก้ AP ทีละตัวโดยไม่ตรวจ switch"
  design_note: "ลูกโซ่ภายในเครือข่ายอย่างเดียว (ไม่ข้ามระบบ) — เห็นต้นตอจากการที่ switch อยู่ในรายการที่มีปัญหา"

- id: NET-04
  title: "AP 2 ตัวชั้นเดียวกันดับพร้อมกัน กล้อง subnet เดียวกันปกติ"
  category: network_down
  prompt_kind: analyze_device
  input:
    type: ap
    name: "AP-FL3-02"
    ip: "192.168.30.12"
    status: "down/มีปัญหา"
    apContext: "AP อื่นที่มีปัญหา 1 ตัว: AP-FL3-03 (192.168.30.13) down"
    cameraContext: "subnet เดียวกัน 2 ตัว ออฟไลน์ 0 ตัว — ไม่พบ"
  ground_truth:
    root_cause: "AP 2 ตัวที่ IP ติดกันดับพร้อมกัน ขณะที่กล้อง 2 ตัวใน subnet เดียวกันปกติ แปลว่า switch/subnet โดยรวมยังทำงาน จุดร่วมน่าจะเป็นสิ่งเฉพาะที่ AP ทั้งสองใช้ร่วมกัน เช่น กลุ่มพอร์ต PoE/งบพลังงาน PoE เดียวกัน แผงสาย (patch panel) หรือวงจรไฟเดียวกัน ไม่ใช่ AP เสียพร้อมกันโดยบังเอิญ"
    partial_root_cause: "ชี้ว่ามีจุดร่วมของ AP 2 ตัว แต่ไม่ระบุกลไกที่เป็นไปได้ หรือระบุว่าเป็น switch ล่มทั้งตัวทั้งที่กล้องปกติ (ขัดกับหลักฐานบางส่วน)"
    wrong_root_cause_examples:
      - "สรุปว่า AP 2 ตัวเสียแยกกัน"
      - "สรุปว่าเครือข่ายทั้ง subnet ล่ม"
    key_evidence:
      - "AP-FL3-03 (IP ติดกัน .12/.13) ก็ down"
      - "กล้องใน subnet เดียวกัน ออฟไลน์ 0 ตัว"
    severity: medium
    severity_rationale: "กระทบ AP 2 จุด (พื้นที่ครอบคลุมสองส่วนของชั้น 3) ยังมีกล้องและอุปกรณ์อื่นทำงาน"
    correct_actions:
      - "ตรวจพอร์ต PoE ที่ต่อ AP ทั้งสอง (งบ PoE ของ switch/พอร์ตเดียวกัน/โมดูลเดียวกัน)"
      - "ตรวจ patch panel/สายที่เดินร่วมกัน"
      - "ตรวจวงจรไฟหรือ injector ถ้าใช้แยก"
    unacceptable_actions:
      - "เปลี่ยน AP ทั้งสองตัวทันทีโดยไม่ตรวจจุดร่วม"
      - "รีสตาร์ททั้ง switch โดยไม่ประเมินผลกระทบกล้อง"
  design_note: "AI ต้องใช้หลักฐาน 'กล้องปกติ' ตัดสมมติฐาน switch ล่มทั้งตัว — ทดสอบการให้เหตุผลจากข้อมูลที่ขัดกับสมมติฐานแรก"

- id: NET-05
  title: "AP สำรองในโกดังหลุด (ไม่มีผู้ใช้กระทบ)"
  category: network_down
  prompt_kind: alert
  input:
    description: "Omada: AP-WH-Spare-02 Disconnected"
    host: "AP-WH-Spare-02"
    priorityLabel: "คำเตือน"
    lastChange: "15/10/2569 08:20:11"
    comments: "AP สำรองในโกดัง ไม่ได้ใช้งานประจำ เปิดใช้เฉพาะช่วงจัดอีเว้นต์ ไม่มีผู้ใช้เชื่อมต่อ"
  ground_truth:
    root_cause: "AP สำรองที่ไม่ได้ใช้งานประจำหลุดการเชื่อมต่อ (อาจถูกปิดไฟ/ถอดสาย/ปิดเครื่องไว้) ไม่มีผลกระทบต่อผู้ใช้ ไม่ใช่เหตุขัดข้องของเครือข่าย"
    partial_root_cause: "ระบุว่าผลกระทบต่ำ แต่ยังแนะนำให้ตรวจสอบเชิงรุกเกินความจำเป็น (เช่น ให้ไปหน้างานทันที)"
    wrong_root_cause_examples:
      - "จัดเป็นเหตุด่วน/ปัญหาเครือข่ายรุนแรง"
    key_evidence:
      - "หมายเหตุ: AP สำรอง ไม่ได้ใช้งานประจำ ไม่มีผู้ใช้เชื่อมต่อ"
    severity: low
    severity_rationale: "ไม่มีผู้ใช้และไม่มีบริการที่ได้รับผลกระทบ"
    correct_actions:
      - "ยืนยันว่าเครื่องถูกปิดไว้ตั้งใจหรือไม่"
      - "ตรวจสถานะไฟ/สายก่อนช่วงจัดอีเว้นต์ครั้งถัดไป"
      - "ไม่ต้องดำเนินการทันที"
    unacceptable_actions:
      - "แนะนำแก้ไขฉุกเฉินหรือแจ้ง incident ระดับสูง"
  design_note: "เคสเหตุจริงแต่ผลกระทบต่ำ (แยกจาก false alarm ที่เป็นเรื่องปกติทางเทคนิค) — ทดสอบการประเมินความรุนแรงโดยใช้บริบทจาก comments"
