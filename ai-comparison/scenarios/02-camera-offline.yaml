# ═══════════════════════════════════════════════════════════════════════════════
# หมวด 2: กล้องออฟไลน์ / ภาพเสีย — ข้อมูลรูปแบบ HikCentral
# 5 เคส: CAM-01 … CAM-05
# (ground_truth เขียนก่อนรัน AI ทุกเคส — ดู ../README.md)
# ═══════════════════════════════════════════════════════════════════════════════

- id: CAM-01
  title: "กล้องดับเครื่องเดียว กล้องอื่นในไซต์ปกติ"
  category: camera_offline
  prompt_kind: analyze_device
  input:
    type: camera
    name: "HQ-CAM-012"
    ip: "192.168.20.12"
    status: "🔴 ออฟไลน์"
    apContext: "subnet เดียวกัน: ไม่พบ"
    cameraContext: "ไซต์ HQ มี 11 ตัว ออฟไลน์ 0 ตัว — ไม่พบ"
  ground_truth:
    root_cause: "ปัญหาเฉพาะตัวกล้อง HQ-CAM-012 หรือจุดเชื่อมต่อของมัน (สายแลน/พอร์ต PoE/ไฟเลี้ยงกล้อง/ตัวกล้องเสีย) เพราะกล้องอื่นอีก 11 ตัวในไซต์เดียวกันปกติ จึงไม่ใช่ switch หรือ NVR ทั้งไซต์"
    partial_root_cause: "ระบุว่าเป็นปัญหาเฉพาะจุด แต่ไม่แยกกลไกย่อย หรือกล่าวถึงเครือข่ายทั่วไปโดยยังชี้ที่กล้องตัวนี้"
    wrong_root_cause_examples:
      - "สรุปว่า switch/NVR ทั้งไซต์ล่ม"
      - "สรุปว่าเป็นปัญหาซอฟต์แวร์ HikCentral ทั้งระบบ"
    key_evidence:
      - "ไซต์ HQ มี 11 ตัว ออฟไลน์ 0 ตัว"
    severity: medium
    severity_rationale: "เกิดจุดบอด 1 จุดของการเฝ้าระวัง ยังมีกล้องอื่นทำงาน ไม่ใช่ทั้งไซต์"
    correct_actions:
      - "ตรวจว่าพอร์ต PoE ของ switch ที่ต่อกล้องจ่ายไฟอยู่ และไฟสถานะกล้องติดหรือไม่"
      - "ทดสอบสายแลนและ ping IP ของกล้อง"
      - "รีสตาร์ทกล้อง (สลับพอร์ต/รีเซ็ต PoE) แล้วเช็คใหม่"
      - "ไปตรวจหน้างานถ้ายังไม่กลับ"
    unacceptable_actions:
      - "รีสตาร์ท switch หรือ NVR ทั้งไซต์"
  design_note: "baseline ของหมวดกล้อง — ปัญหาจุดเดียว"

- id: CAM-02
  title: "กล้องภายนอกภาพดำหลังฝนตก (ยัง ping ได้)"
  category: camera_offline
  prompt_kind: alert
  input:
    description: "HQ-CAM-007: Video signal lost (ภาพดำ)"
    host: "HQ-CAM-007"
    priorityLabel: "ปานกลาง"
    lastChange: "15/10/2569 10:42:30"
    comments: "อุปกรณ์ยังตอบ ping ได้และ HikCentral รายงานสถานะออนไลน์ แต่ stream ไม่มีภาพ (video loss ช่อง 1) เกิดหลังฝนตกหนักเมื่อคืน กล้องติดตั้งภายนอกอาคาร"
  ground_truth:
    root_cause: "ปัญหาที่ตัวกล้อง/ส่วนภาพ (เซนเซอร์/เลนส์/ความชื้นเข้าตัวกล้อง/หัวต่อหรือสายสัญญาณภาพ/ไฟเลี้ยงไม่พอ) ไม่ใช่เครือข่าย เพราะอุปกรณ์ยังตอบ ping และออนไลน์อยู่ อาการเกิดหลังฝนตกหนักสอดคล้องกับความชื้น/น้ำเข้า"
    partial_root_cause: "ระบุว่าเป็นที่ตัวกล้องหรือภาพ แต่ไม่เชื่อมกับฝน/ความชื้น หรือให้น้ำหนักเครือข่ายพอๆ กับตัวกล้อง"
    wrong_root_cause_examples:
      - "สรุปว่า switch/uplink ล่มเป็นหลัก"
      - "แนะนำให้แก้ IP/DHCP"
    key_evidence:
      - "ยัง ping ได้ / สถานะออนไลน์"
      - "video loss ช่อง 1"
      - "เกิดหลังฝนตกหนัก ติดตั้งภายนอก"
    severity: medium
    severity_rationale: "กล้อง 1 ตัวไม่มีภาพ (จุดบอด) แต่ไม่ใช่การล่มของระบบทั้งไซต์"
    correct_actions:
      - "ไปตรวจหน้างาน: ความชื้น/น้ำในตัวกล้อง หัวต่อกันน้ำ สภาพสาย"
      - "ตรวจไฟเลี้ยง/PoE จ่ายกำลังพอหรือไม่"
      - "ถ้าน้ำเข้า ซับ/เปลี่ยนกล้อง ตรวจซีลกันน้ำ"
    unacceptable_actions:
      - "เน้นแก้เครือข่าย/รีสตาร์ท switch"
  design_note: "ทดสอบการใช้ข้อมูลเชิงบริบท (ping ปกติ + เกิดหลังฝน) แยกปัญหาภาพออกจากปัญหาเครือข่าย"

- id: CAM-03
  title: "กล้องครึ่งไซต์ (หมายเลข 101-116) ออฟไลน์เป็นช่วงต่อเนื่อง"
  category: camera_offline
  prompt_kind: context_text
  input:
    topic: camera
    context: "กล้องทั้งหมด 32 เครื่อง ปกติ 16 มีปัญหา 16: HQ-CAM-101, HQ-CAM-102, HQ-CAM-103, HQ-CAM-104, HQ-CAM-105"
  ground_truth:
    root_cause: "กล้อง 16 ตัวจากทั้งหมด 32 ออฟไลน์พร้อมกัน และรายชื่อที่แสดงเป็นเลขเรียงต่อเนื่อง (101-105…) บ่งชี้จุดร่วมของกลุ่มกล้องนั้น เช่น switch/VLAN/NVR หรือสาย trunk ที่ให้บริการกล้องชุด 101-116 มากกว่ากล้องเสียแยกกัน 16 ตัว"
    partial_root_cause: "ชี้ว่าเกิดพร้อมกันหลายตัวจึงน่าจะมีจุดร่วม แต่ไม่ได้กล่าวถึงลำดับเลขต่อเนื่อง/กลุ่มเดียวกัน หรือแนะนำตรวจทั้งระบบกว้างๆ"
    wrong_root_cause_examples:
      - "สรุปว่ากล้อง 16 ตัวเสียแยกกัน"
      - "ฟันธงชื่ออุปกรณ์เฉพาะที่ไม่มีอยู่ในข้อมูล"
    key_evidence:
      - "มีปัญหา 16 จาก 32 (ครึ่งหนึ่ง)"
      - "ชื่อกล้องที่ยกตัวอย่างเรียงต่อเนื่อง 101-105"
    severity: high
    severity_rationale: "ครึ่งหนึ่งของกล้องทั้งหมดใช้งานไม่ได้ เป็นการสูญเสียการเฝ้าระวังเป็นวงกว้าง แต่ยังมีกล้องอีกครึ่งทำงาน"
    correct_actions:
      - "ตรวจ switch/NVR/VLAN ที่ให้บริการกล้องกลุ่ม 101-116"
      - "ตรวจไฟเลี้ยงหรือ uplink ของ switch กลุ่มนี้"
      - "ตรวจว่ากล้องยังบันทึกลง SD/NVR เองหรือไม่ เพื่อประเมินช่องว่างของภาพ"
    unacceptable_actions:
      - "ไล่ตรวจกล้องทีละตัวโดยไม่หาจุดร่วมก่อน"
  design_note: "ข้อมูลในบอทจริงตัดรายชื่อเหลือ 5 ตัว (cameraCtxText) — AI ต้องอนุมานจากตัวเลขและลำดับ ไม่ให้ข้อมูลครบ"

- id: CAM-04
  title: "กล้องประตูทางเข้าหลักออฟไลน์เกิน 4 วัน"
  category: camera_offline
  prompt_kind: camera_single
  input:
    name: "HQ-CAM-003"
    location: "ประตูทางเข้าหลัก"
    status: "🔴 ออฟไลน์"
    duration: "4 วัน 3 ชั่วโมง"
    offlineSince: "11/10/2569 07:05:00"
  ground_truth:
    root_cause: "ออฟไลน์นานหลายวันไม่ใช่อาการชั่วคราว มักเกิดจากความเสียหายทางกายภาพหรือไฟ/สายขาดที่ต้องไปแก้หน้างาน (กล้องเสีย สายขาด พอร์ต/PoE ตาย) ไม่ใช่ glitch ที่จะหายเอง"
    partial_root_cause: "ระบุสาเหตุที่เป็นไปได้ถูกทิศ แต่ไม่ได้ชี้ว่าระยะเวลา 4 วันหมายถึงต้องไปหน้างาน หรือไม่ได้เน้นความสำคัญของตำแหน่ง"
    wrong_root_cause_examples:
      - "ประเมินว่าเป็นอาการชั่วคราว แนะนำรอดูต่อ"
    key_evidence:
      - "ดับมา 4 วัน 3 ชั่วโมง"
      - "ตำแหน่งประตูทางเข้าหลัก"
    severity: high
    severity_rationale: "ตำแหน่งสำคัญทางความปลอดภัย (ทางเข้าหลัก) ที่ไม่มีภาพนาน 4 วัน ถือเป็นจุดบอดสำคัญและเนิ่นนานเกินควร ต้องเร่งแก้และมีมาตรการชั่วคราว"
    correct_actions:
      - "จัดช่างไปตรวจหน้างานเร่งด่วน (ไฟ/สาย/พอร์ต PoE/ตัวกล้อง)"
      - "หามาตรการชั่วคราว เช่น เพิ่มการเดินตรวจของ รปภ. หรือกล้องสำรอง"
      - "ตั้งเตือนซ้ำเมื่อดับเกินเกณฑ์เวลา"
    unacceptable_actions:
      - "รอให้กลับมาเอง หรือรีสตาร์ทระยะไกลเท่านั้น โดยไม่ไปหน้างาน"
  design_note: "ความรุนแรงมาจากตำแหน่ง + ระยะเวลา ไม่ใช่จำนวนอุปกรณ์ — ทดสอบการชั่งน้ำหนักบริบท (ตรงกับ prompt จริง 'วิเคราะห์กล้อง CAM-xxx')"

- id: CAM-05
  title: "กล้องอาคารเก่า (ยังไม่เปิดใช้งาน) ออฟไลน์ 12 วัน"
  category: camera_offline
  prompt_kind: camera_single
  input:
    name: "PLANT-CAM-088"
    location: "อาคารเก่า (ยังไม่เปิดใช้งาน) ชั้น 2"
    status: "🔴 ออฟไลน์"
    duration: "12 วัน"
    offlineSince: "03/10/2569 16:00:00"
  ground_truth:
    root_cause: "กล้องอยู่ในอาคารที่ยังไม่เปิดใช้งาน การออฟไลน์นานเป็นสิ่งที่คาดได้ (อาจปิดไฟ/ตัดไฟอาคารตั้งใจ) ไม่ใช่เหตุขัดข้องที่ต้องรีบแก้"
    partial_root_cause: "ระบุว่าอาจเป็นเรื่องปกติ แต่ยังแนะนำให้ไปตรวจหน้างานทันทีหรือให้ความสำคัญสูง"
    wrong_root_cause_examples:
      - "จัดเป็นเหตุฉุกเฉินหรือปัญหาความปลอดภัยเร่งด่วน"
    key_evidence:
      - "ตำแหน่ง: อาคารเก่า ยังไม่เปิดใช้งาน"
    severity: low
    severity_rationale: "ไม่มีผู้ใช้/ทรัพย์สินสำคัญในพื้นที่ ความเสี่ยงต่ำ แม้เวลาออฟไลน์จะนาน"
    correct_actions:
      - "ยืนยันสถานะการใช้งานพื้นที่และการตัดไฟอาคาร"
      - "ถ้าตั้งใจปิด ให้พักการเฝ้าระวังหรือแยกกลุ่มเพื่อลดการแจ้งเตือนรบกวน"
      - "วางแผนตรวจก่อนเปิดใช้อาคาร"
    unacceptable_actions:
      - "ส่งช่างฉุกเฉินหรือยกระดับเป็นเหตุใหญ่"
  design_note: "ตรงข้ามกับ CAM-04: เวลานานเท่ากันแต่ตำแหน่งไม่สำคัญ — ทดสอบว่า AI ไม่ตัดสินจากระยะเวลาอย่างเดียว"
