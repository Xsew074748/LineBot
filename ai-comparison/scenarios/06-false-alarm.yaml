# ═══════════════════════════════════════════════════════════════════════════════
# หมวด 6: False alarm — ข้อมูลดูผิดปกติแต่จริงๆ เป็นเรื่องปกติ/คาดการณ์ได้
# 5 เคส: FAL-01 … FAL-05 (ทุกเคส ground truth severity = low)
#
# ป้ายกำกับ priority ของ trigger ในเคสเหล่านี้ตั้งสูง (สูง/วิกฤต) โดยเจตนา เพื่อทดสอบว่า AI
# ตัดสินจากบริบทใน comments ไม่ใช่ตามป้ายกำกับ  (แหล่งของบริบทระบุไว้ในแต่ละ design_note)
# ═══════════════════════════════════════════════════════════════════════════════

- id: FAL-01
  title: "server ดับตามแผน maintenance window (ป้ายวิกฤต)"
  category: false_alarm
  prompt_kind: alert
  input:
    description: "Unavailable by ICMP ping"
    host: "SRV-APP-02"
    priorityLabel: "วิกฤต"
    lastChange: "16/10/2569 02:14:07"
    comments: "อยู่ในช่วง Maintenance ตามแผน CHG-2291: ติดตั้ง Windows patch และรีบูต เวลา 02:00-04:00 (ผู้ดำเนินการ: ทีม Infra); ได้รับอนุมัติแล้ว"
  ground_truth:
    root_cause: "เครื่องหายจาก ping เพราะอยู่ระหว่างงาน maintenance ที่วางแผนและอนุมัติไว้ (รีบูตหลัง patch) ไม่ใช่เหตุขัดข้อง"
    partial_root_cause: "ระบุว่าอาจเป็นช่วงบำรุงรักษา แต่ยังแนะนำให้ตรวจสอบ/กู้เครื่องทันทีเหมือนเป็นเหตุจริง"
    wrong_root_cause_examples:
      - "จัดเป็นเหตุวิกฤตและสั่งแก้ทันที"
    key_evidence:
      - "Maintenance ตามแผน CHG-2291 เวลา 02:00-04:00"
      - "เหตุเกิด 02:14 อยู่ในช่วง"
    severity: low
    severity_rationale: "คาดการณ์ได้และอยู่ในแผน ไม่มีผลกระทบเกินที่ยอมรับ"
    correct_actions:
      - "ไม่ต้องแก้ไข รอให้งานเสร็จตามแผน"
      - "ตรวจสอบว่าเครื่องกลับมาปกติหลังหมดเวลา 04:00 ถ้ายังไม่กลับให้ยกระดับ"
    unacceptable_actions:
      - "สั่งกู้เครื่อง/แจ้ง incident ทันทีระหว่างช่วง maintenance"
  design_note: "บริบทมาจาก comments (ข้อมูลใน Zabbix จริงมักผูกกับ maintenance period) ตัวป้าย 'วิกฤต' เป็นเหยื่อ"

- id: FAL-02
  title: "CPU สูงเพราะงาน backup รายคืน (baseline เดิมทุกคืน)"
  category: false_alarm
  prompt_kind: alert
  input:
    description: "High CPU utilization (over 90% for 5m)"
    host: "SRV-BACKUP-01"
    priorityLabel: "สูง"
    lastChange: "16/10/2569 01:37:20"
    comments: "งาน backup รายคืนรันช่วง 01:00-03:30 ทำให้ CPU 90-100% ทุกคืน (baseline 30 วันย้อนหลังเหมือนกันทุกคืน); คืนนี้ CPU เฉลี่ย 93%; ไม่มีบริการอื่นบนเครื่องนี้"
  ground_truth:
    root_cause: "CPU สูงจากงาน backup ตามกำหนดซึ่งเป็นพฤติกรรมปกติของเครื่องนี้ (baseline เดิมทุกคืนตลอด 30 วัน) ไม่ใช่ปัญหา"
    partial_root_cause: "ระบุว่าเป็นงาน backup แต่ยังแนะนำตรวจแก้ไข/ลดโหลดโดยไม่จำเป็น"
    wrong_root_cause_examples:
      - "สรุปว่าเป็นโปรเซสผิดปกติ/เครื่องมีปัญหา"
    key_evidence:
      - "backup 01:00-03:30 CPU 90-100% ทุกคืน"
      - "คืนนี้ 93% อยู่ในช่วงเวลาและระดับเดียวกับ baseline"
    severity: low
    severity_rationale: "เป็นพฤติกรรมตามปกติ ไม่มีผลกระทบ"
    correct_actions:
      - "ไม่ต้องแก้ไข"
      - "ปรับเกณฑ์เตือนให้ยกเว้นช่วงเวลา backup เพื่อลดการเตือนซ้ำ"
    unacceptable_actions:
      - "ฆ่าโปรเซส backup/รีสตาร์ทเครื่อง"
  design_note: "ข้อมูลอ้างอิง baseline อยู่ใน comments"

- id: FAL-03
  title: "กล้องรีบูตตามเวลา 03:00 ทุกวัน (ออฟไลน์ 2 นาที)"
  category: false_alarm
  prompt_kind: alert
  input:
    description: "HikCentral: PLANT-CAM-044 ออฟไลน์"
    host: "PLANT-CAM-044"
    priorityLabel: "ปานกลาง"
    lastChange: "16/10/2569 03:00:12"
    comments: "กล้องตั้งเวลารีบูตอัตโนมัติทุกวัน 03:00 และกลับมาออนไลน์ภายใน 3-5 นาทีทุกครั้ง (ประวัติ 14 วัน); ขณะนี้ออฟไลน์มา 2 นาที"
  ground_truth:
    root_cause: "กล้องรีบูตตามตารางเวลาที่ตั้งไว้ (03:00 ทุกวัน) และเคยกลับมาออนไลน์ภายใน 3-5 นาทีตลอด 14 วัน ตอนนี้ 2 นาทียังอยู่ในช่วงปกติ ไม่ใช่เหตุขัดข้อง"
    partial_root_cause: "ระบุว่าอาจเป็นการรีบูตตามตาราง แต่ยังแนะนำไปตรวจหน้างานหรือรีสตาร์ทซ้ำทันที"
    wrong_root_cause_examples:
      - "สรุปว่ากล้องเสีย/สายขาด/PoE มีปัญหา"
    key_evidence:
      - "รีบูตอัตโนมัติ 03:00 ทุกวัน"
      - "กลับมาภายใน 3-5 นาทีตลอด 14 วัน; ตอนนี้ 2 นาที"
    severity: low
    severity_rationale: "ตามกำหนดการปกติและเวลาออฟไลน์ยังอยู่ในกรอบ"
    correct_actions:
      - "รอ 5 นาทีแล้วตรวจว่ากลับมาออนไลน์ ถ้าเกินเวลาปกติจึงตรวจต่อ"
      - "ตั้งเงื่อนไขไม่เตือนในช่วงรีบูตตามตาราง"
    unacceptable_actions:
      - "ส่งช่างหน้างานทันที"
  design_note: "ประวัติการรีบูตอยู่ใน comments"

- id: FAL-04
  title: "Bandwidth uplink พุ่ง 84% เช้าวันจันทร์ทุกสัปดาห์"
  category: false_alarm
  prompt_kind: alert
  input:
    description: "High bandwidth usage on interface Gi0/1 (uplink) (>80% for 10m)"
    host: "SW-CORE-01"
    priorityLabel: "คำเตือน"
    lastChange: "19/10/2569 08:52:30"
    comments: "วันจันทร์ 08:45 พนักงาน ~300 คนเข้าระบบพร้อมกัน; สูงสุด 84% นาน 12 นาที แล้วลดลงเองเหลือ ~40%; เกิดซ้ำทุกวันจันทร์ (ประวัติ 8 สัปดาห์); ค่าเฉลี่ยวันปกติ 35%; ไม่มี packet loss และผู้ใช้ไม่แจ้งว่าช้า"
  ground_truth:
    root_cause: "แบนด์วิดท์พุ่งช่วงเช้าวันจันทร์จากผู้ใช้ประมาณ 300 คนเข้าระบบพร้อมกัน เป็นรูปแบบซ้ำสม่ำเสมอ 8 สัปดาห์ ลดลงเอง ไม่มี packet loss — เป็นภาระงานปกติ ไม่ใช่เหตุขัดข้อง"
    partial_root_cause: "ระบุว่าเป็นช่วง peak ปกติ แต่แนะนำแก้ไขหรือเพิ่มแบนด์วิดท์ทันที"
    wrong_root_cause_examples:
      - "สรุปว่ามีการโจมตี/ไวรัส/ลิงก์เสีย"
    key_evidence:
      - "เกิดซ้ำทุกวันจันทร์ 8 สัปดาห์ ลดลงเอง"
      - "ไม่มี packet loss / ผู้ใช้ไม่แจ้งช้า"
    severity: low
    severity_rationale: "เป็นรูปแบบการใช้งานปกติ ไม่กระทบคุณภาพบริการ"
    correct_actions:
      - "ไม่ต้องแก้ไขเร่งด่วน"
      - "พิจารณาปรับเกณฑ์เตือนตามช่วงเวลา และวางแผนความจุระยะยาวถ้าแนวโน้มโตขึ้น"
    unacceptable_actions:
      - "ตัดการเชื่อมต่อ/บล็อกทราฟฟิกหรือสั่งเพิ่มลิงก์ฉุกเฉิน"
  design_note: "ข้อมูลเชิงเวลา/ประวัติ (จันทร์ 08:45 ทุกสัปดาห์) ทำให้เห็นว่าเป็น pattern"

- id: FAL-05
  title: "เซนเซอร์อุณหภูมิห้องเซิร์ฟเวอร์อ่านค่า 78°C ครั้งเดียว (ป้ายวิกฤต)"
  category: false_alarm
  prompt_kind: alert
  input:
    description: "High temperature in server room (>35°C)"
    host: "SENSOR-SVRROOM-01"
    priorityLabel: "วิกฤต"
    lastChange: "16/10/2569 13:20:00"
    comments: "อ่านค่า 78.4°C เพียง 1 ครั้ง (1 นาที) ค่าก่อนหน้า 24.0°C และค่าถัดมา 24.1°C; เซนเซอร์อีก 2 ตัวในห้องเดียวกันอ่าน 24.1°C และ 23.8°C; เครื่องปรับอากาศทำงานปกติ; ไม่มี alert จาก UPS หรือ server ใดๆ"
  ground_truth:
    root_cause: "ค่า 78.4°C เป็นค่าผิดปกติเพียงจุดเดียว (spike 1 นาที) ขัดกับค่าก่อน-หลัง (24°C) เซนเซอร์อื่นในห้อง (24°C) และสถานะแอร์/UPS/server ปกติ — น่าจะเป็นความผิดพลาดของเซนเซอร์หรือสัญญาณรบกวน ไม่ใช่ความร้อนจริง"
    partial_root_cause: "ระบุว่าอาจเป็นเซนเซอร์ผิดพลาด แต่ยังเน้นเป็นเหตุฉุกเฉินหรือแนะนำมาตรการรุนแรง"
    wrong_root_cause_examples:
      - "สรุปว่าห้องร้อนจริงและแอร์เสีย"
      - "แนะนำปิดเซิร์ฟเวอร์ฉุกเฉิน"
    key_evidence:
      - "ค่าสูงเพียง 1 ครั้ง ก่อน/หลังปกติ 24°C"
      - "เซนเซอร์อีก 2 ตัวอ่าน ~24°C"
      - "แอร์ UPS server ปกติ"
    severity: low
    severity_rationale: "หลักฐานหลายทางบ่งชี้ว่าไม่ใช่ความร้อนจริง เพียงแต่ควรตรวจเซนเซอร์"
    correct_actions:
      - "ตรวจสอบเซนเซอร์ตัวนี้ (การเชื่อมต่อ/สภาพ) และสังเกตค่าต่อไป"
      - "ยืนยันอุณหภูมิห้องจริงจากเซนเซอร์อื่นหรือการตรวจสอบทางกายภาพอย่างรวดเร็ว"
      - "ถ้าเกิดซ้ำ ซ่อมหรือเปลี่ยนเซนเซอร์"
    unacceptable_actions:
      - "ปิด server ฉุกเฉิน หรือเรียกเหตุสูงสุดเนื่องจากอุณหภูมิ 78°C"
  design_note: "ป้าย 'วิกฤต' + ตัวเลข 78°C เป็นเหยื่อสูง — ทดสอบการชั่งน้ำหนักหลักฐานหลายแหล่ง (cross-check) และความปลอดภัยของคำแนะนำ"
