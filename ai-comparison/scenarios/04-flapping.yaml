# ═══════════════════════════════════════════════════════════════════════════════
# หมวด 4: สัญญาณ flapping (ล่มๆ หายๆ ไม่นิ่งในเวลาสั้น)
# 4 เคส: FLAP-01 … FLAP-04
#
# หมายเหตุ: prompt จริงของบอทไม่มีฟิลด์ "ประวัติการเปลี่ยนสถานะ" — ประวัติ flapping ใส่ใน comments
# (ต้องระบุเป็นข้อจำกัดในเล่มรายงาน เช่นเดียวกับหมวด host_resource)
# ═══════════════════════════════════════════════════════════════════════════════

- id: FLAP-01
  title: "ลิงก์ไฟเบอร์ uplink สะดุด 17 ครั้ง/30 นาที (CRC สูง แสงอ่อน)"
  category: flapping
  prompt_kind: alert
  input:
    description: "Interface Gi0/24 (uplink to SW-CORE-01): Link down"
    host: "SW-FL2-01"
    priorityLabel: "สูง"
    lastChange: "15/10/2569 11:05:42"
    comments: "ลิงก์ down/up 17 ครั้งใน 30 นาที (แต่ละครั้ง down 5-20 วินาที); CRC errors เพิ่ม 4,210 ในช่วงเดียวกัน; SFP RX power -19.8 dBm (ค่าปกติของ SFP นี้ -3 ถึง -14 dBm); ใช้ไฟเบอร์ multimode ระยะ ~180 ม."
  ground_truth:
    root_cause: "ลิงก์ไฟเบอร์ทางกายภาพเสื่อม: แสดงโดยกำลังแสงรับ -19.8 dBm ต่ำกว่าช่วงปกติมาก และ CRC errors สูง (หัวไฟเบอร์สกปรก/สายหัก-โค้งเกิน/SFP เสื่อม) — ไม่ใช่ปัญหาการตั้งค่าหรือซอฟต์แวร์"
    partial_root_cause: "ระบุว่าเป็นปัญหาทางกายภาพของลิงก์/พอร์ต แต่ไม่ใช้ค่ากำลังแสงหรือ CRC เป็นเหตุผล หรือไม่ระบุว่าเป็นไฟเบอร์/SFP"
    wrong_root_cause_examples:
      - "สรุปว่าเป็นปัญหา STP/VLAN/การตั้งค่า"
      - "สรุปว่า switch ทั้งตัวเสียโดยไม่พูดถึงลิงก์"
    key_evidence:
      - "flap 17 ครั้ง/30 นาที"
      - "CRC errors +4,210"
      - "RX power -19.8 dBm ต่ำกว่าช่วงปกติ"
    severity: high
    severity_rationale: "uplink ของชั้นสะดุดบ่อย กระทบผู้ใช้ทั้งชั้นเป็นช่วงๆ และมีโอกาสขาดถาวร"
    correct_actions:
      - "ทำความสะอาดหัวไฟเบอร์และตรวจโค้งงอของสาย"
      - "เปลี่ยน patch cord หรือ SFP แล้ววัดกำลังแสงซ้ำ"
      - "ประสานเตรียมลิงก์สำรองหรือหมุนเวลาซ่อมช่วงที่ผลกระทบน้อย"
    unacceptable_actions:
      - "แก้ไขที่การตั้งค่า STP/VLAN เป็นหลัก"
      - "รีสตาร์ท switch ซ้ำๆ เป็นทางแก้"
  design_note: "มีหลักฐานเชิงตัวเลขชัด (CRC, RX power) — ทดสอบการใช้ค่าวัดเพื่อชี้ว่าเป็นปัญหาทางกายภาพ"

- id: FLAP-02
  title: "AP สลับ Connected/Disconnected 9 ครั้ง/ชม. (PoE เกือบเต็มขีดจำกัด)"
  category: flapping
  prompt_kind: alert
  input:
    description: "Omada: AP-Meeting-03 สลับสถานะ Connected/Disconnected"
    host: "AP-Meeting-03"
    priorityLabel: "ปานกลาง"
    lastChange: "15/10/2569 10:15:30"
    comments: "เปลี่ยนสถานะ 9 ครั้งใน 1 ชั่วโมง; ต่อ PoE จาก SW-FL3-01 พอร์ต 12 จ่ายไฟ 29.6 W (ขีดจำกัดพอร์ต 30 W); เมื่อวานเพิ่งเปิดใช้งาน 2 radio เต็มกำลัง; สายแลนยาว ~85 ม.; switch ตัวอื่นและ AP อื่นบน switch เดียวกันปกติ"
  ground_truth:
    root_cause: "AP-Meeting-03 ดึงไฟ PoE ใกล้ขีดจำกัดพอร์ต (29.6/30 W) หลังเปิด 2 radio เต็มกำลัง ร่วมกับสาย ~85 ม. ทำให้แรงดัน/พลังงานตกเป็นช่วงๆ แล้วรีเซ็ตสลับสถานะ — ปัญหาเฉพาะจุดด้านพลังงาน PoE ของ AP นี้ ไม่ใช่ switch ทั้งตัว"
    partial_root_cause: "ระบุว่าเป็นเรื่องไฟ/PoE ของ AP นี้ แต่ไม่เชื่อมกับการเปิด 2 radio หรือความยาวสาย"
    wrong_root_cause_examples:
      - "สรุปว่า switch เสียหรือเครือข่ายทั้งชั้นมีปัญหา"
      - "สรุปว่าเป็นปัญหา firmware/ซอฟต์แวร์เป็นหลัก"
    key_evidence:
      - "จ่ายไฟ 29.6 W ขีดจำกัด 30 W"
      - "เพิ่งเปิด 2 radio เต็มกำลังเมื่อวาน"
      - "AP อื่นบน switch เดียวกันปกติ"
    severity: medium
    severity_rationale: "กระทบ AP ห้องประชุม 1 จุด เชื่อมต่อได้เป็นช่วงๆ ไม่ใช่ขัดข้องทั้งระบบ"
    correct_actions:
      - "ลดกำลังส่ง/ปิด radio บางตัวชั่วคราว หรือย้ายไปพอร์ตที่รองรับ PoE+ (มากกว่า 30 W)"
      - "ใช้ PoE injector หรือไฟ DC แยกสำหรับ AP นี้"
      - "ตรวจคุณภาพสายและความยาว"
    unacceptable_actions:
      - "เปลี่ยน switch หรือ AP หลายตัวทันที"
  design_note: "สาเหตุอยู่ที่ตัวเลขใน comments (29.6/30 W) — ทดสอบการอ่านค่าเชิงตัวเลขเพื่อชี้สาเหตุเชิงพลังงาน"

- id: FLAP-03
  title: "กล้อง Online/Offline สลับ 12 ครั้ง/20 นาที (IP ชนกัน)"
  category: flapping
  prompt_kind: alert
  input:
    description: "HikCentral: HQ-CAM-021 ออนไลน์/ออฟไลน์ สลับกัน"
    host: "HQ-CAM-021"
    priorityLabel: "ปานกลาง"
    lastChange: "15/10/2569 12:20:10"
    comments: "สลับ 12 ครั้งใน 20 นาที; ping ตอบเป็นช่วงๆ; ARP table บน SW-FL1-01 พบ 192.168.20.21 สลับระหว่าง 2 MAC (ลงท้าย :3A:11 = กล้อง, :9C:E4 = อุปกรณ์ที่ไม่ทราบ); เมื่อวานมีติดตั้ง IP phone ใหม่ในโซนเดียวกัน"
  ground_truth:
    root_cause: "IP address ชนกัน (IP conflict): 192.168.20.21 ถูกใช้โดย 2 MAC พร้อมกัน (กล้อง และอุปกรณ์ :9C:E4 ที่น่าจะเป็น IP phone ที่เพิ่งติดตั้ง) ทำให้กล้องสลับออนไลน์/ออฟไลน์"
    partial_root_cause: "ระบุว่าเป็นปัญหา IP/ARP/DHCP แต่ไม่ชี้ว่าเป็นการชนกันของสองอุปกรณ์ หรือไม่เชื่อมกับ IP phone ใหม่"
    wrong_root_cause_examples:
      - "สรุปว่ากล้องเสีย/สายเสีย/PoE มีปัญหา"
      - "สรุปว่า switch ล่ม"
    key_evidence:
      - "ARP: IP เดียวกันสลับ 2 MAC"
      - "เพิ่งติดตั้ง IP phone ใหม่โซนเดียวกัน"
    severity: medium
    severity_rationale: "กล้อง 1 ตัวภาพขาดๆ หายๆ และมีผลถึงอุปกรณ์อีกตัวที่ชน IP แก้ได้ง่ายเมื่อรู้สาเหตุ"
    correct_actions:
      - "ค้นหาอุปกรณ์ MAC :9C:E4 (IP phone ใหม่) และกำหนด IP ใหม่ หรือใช้ DHCP reservation"
      - "ตั้ง IP ของกล้องแบบคงที่นอกช่วง DHCP หรือจอง IP"
      - "ตรวจนโยบาย DHCP ว่าแจก IP ทับช่วงกล้องหรือไม่"
    unacceptable_actions:
      - "เปลี่ยนกล้องหรือสาย/พอร์ต PoE เป็นหลัก"
  design_note: "หลักฐานหลักคือ ARP (2 MAC ต่อ 1 IP) — ทดสอบว่า AI จับสัญญาณที่แยก flapping จากปัญหาทางกายภาพ"

- id: FLAP-04
  title: "เซิร์ฟเวอร์พิมพ์หายจาก ping ครั้งละไม่ถึง 30 วินาที (ไม่มีผลกระทบ)"
  category: flapping
  prompt_kind: alert
  input:
    description: "Unavailable by ICMP ping"
    host: "SRV-PRINT-01"
    priorityLabel: "คำเตือน"
    lastChange: "15/10/2569 15:40:18"
    comments: "หาย/กลับมา 3 ครั้งใน 2 ชั่วโมง ครั้งละไม่เกิน 30 วินาที; ช่วงที่หายตรงกับงานพิมพ์ขนาดใหญ่; บริการพิมพ์ทำงานปกติ ไม่มีผู้ใช้แจ้งปัญหา; เป็น VM บนโฮสต์ที่โหลดปกติ"
  ground_truth:
    root_cause: "การหายสั้นๆ ชั่วขณะ (ไม่เกิน 30 วินาที) ที่สัมพันธ์กับงานพิมพ์ใหญ่ น่าจะเป็นการติดขัดชั่วคราวของ network stack/NIC เสมือนขณะโหลดสูง หรือการจำกัดอัตรา ICMP — ไม่กระทบบริการและผู้ใช้ ไม่ใช่เหตุขัดข้อง"
    partial_root_cause: "ระบุว่าผลกระทบต่ำ แต่แนะนำให้ตรวจเชิงรุกหนักเกินความจำเป็น"
    wrong_root_cause_examples:
      - "จัดเป็นเหตุขัดข้องร้ายแรงหรือเซิร์ฟเวอร์ล่ม"
    key_evidence:
      - "ครั้งละไม่เกิน 30 วินาที และตรงกับงานพิมพ์ใหญ่"
      - "บริการทำงานปกติ ไม่มีผู้ใช้แจ้งปัญหา"
    severity: low
    severity_rationale: "ไม่มีผลกระทบต่อผู้ใช้หรือบริการ"
    correct_actions:
      - "เฝ้าดูและบันทึกความถี่"
      - "ถ้าเกิดซ้ำมากขึ้น ตรวจ driver/NIC เสมือน (offload/ตั้งค่า VM) และดูล็อกของโฮสต์"
    unacceptable_actions:
      - "แนะนำแก้ไขเร่งด่วนหรือย้าย/เปลี่ยนเครื่อง"
  design_note: "flapping ที่ไม่ควรตื่นตระหนก — ทดสอบการแยกความถี่/ผลกระทบต่ำออกจาก FLAP-01..03"
