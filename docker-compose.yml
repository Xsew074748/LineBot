services:

  # ── IT Monitor Bot (it-monitor-bot / service line-bot) — ปลดระวางแล้ว (2026-10-02) ──
  # production ย้ายไปเป็น bot ที่ NetGuard Manager คุม: container "netguard-itmonitor"
  # (ข้อมูลอยู่ที่ D:/Project Code/bots/itmonitor, ingress ใน ~/.cloudflared/config.yml ชี้ไป http://netguard-itmonitor:3000)
  # ตัดบริการ line-bot ออกจากไฟล์นี้เพื่อไม่ให้ `docker compose up -d` สร้างตัวเก่ากลับมารันคู่กัน
  # (ตัวเก่ายังเหลือเป็น container ที่หยุดอยู่ ชื่อ it-monitor-bot, restart policy = no — ใช้ rollback ฉุกเฉินเท่านั้น)
  # เก็บ service เดิมไว้ใน git history (commit ก่อนหน้า) ถ้าต้องกู้คืน

  # ── Cloudflare Tunnel ────────────────────────────────────
  # ⚠️ ก่อน docker compose up ครั้งแรก:
  #   1. ปิด cloudflared ที่รันบน Windows (Task Scheduler) ก่อน — ห้ามรัน 2 ตัวพร้อมกัน
  #   2. แก้ C:\Users\phatt\.cloudflared\config.yml:
  #      - ingress service:     http://localhost:3000 → http://line-bot:3000
  #      - credentials-file:    C:\Users\phatt\... → /etc/cloudflared/<tunnel-id>.json
  #        (path ใน container — mount แบบ read-only ด้านล่าง)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: it-monitor-cloudflared
    restart: always
    volumes:
      - C:/Users/phatt/.cloudflared:/etc/cloudflared:ro
    # token mode auth + config.yml สำหรับ ingress (locally-managed tunnel, ตั้ง route ใน Dashboard ไม่ได้)
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bot-net
      # เข้า netguard-net ด้วย เพื่อเรียก netguard-itmonitor (bot ที่ Manager คุม) ตาม ingress ใน config.yml
      - netguard-net

networks:
  bot-net:
    driver: bridge
  netguard-net:
    external: true
