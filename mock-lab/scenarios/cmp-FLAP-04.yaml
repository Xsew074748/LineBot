name: "FLAP-04 — เซิร์ฟเวอร์พิมพ์หายจาก ping ครั้งละไม่ถึง 30 วินาที (ไม่มีผลกระทบ)"
description: "เครื่องปกติ (up) ขณะนี้ — alert คือประวัติที่ยังเปิดอยู่ พร้อมรายละเอียดใน comments"
